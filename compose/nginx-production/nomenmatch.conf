server {
    index index.php index.html;
    server_name match.taibif.tw;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /code;
    listen 80;

    # 隱藏檔(.env、.git、.dockerignore 等)
    location ~ /\. {
        return 404;
    }

    # 不對外的目錄:憑證、資料、匯入腳本、舊版程式、PHP 函式庫原始碼
    location ~ ^/(letsencrypt|solr-data|source-data|workspace|deprecated|scripts|updater|compose|include|v2/(workspace|include|scripts|compose|source-data|solr-data))(/|$) {
        return 404;
    }

    # 只允許實際對外使用的 PHP 入口
    location ~ ^/v2/(api|count)\.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 其他 .php 一律不執行
    location ~ \.php$ {
        return 404;
    }

    # 經 Traefik(HTTPS)進來的會帶 X-Forwarded-Proto: https,直接正常回應;
    # 只有直接打 80 port 的 HTTP 請求才導向 HTTPS,避免無限轉址
    location / {
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }
        try_files $uri $uri/ =404;
    }
}
